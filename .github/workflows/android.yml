name: SonicX Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd project
          DIR=$(dirname "$(find . -name gradlew | head -1)")
          cd "$DIR"
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SonicX-APK
          path: project/**/build/outputs/apk/debug/*.apk
