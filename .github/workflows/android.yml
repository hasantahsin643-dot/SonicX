name: SonicX Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Extract project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Build APK
        run: |
          FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicX-APK
          path: project/**/build/outputs/apk/debuapk.apk
